$kind: http-request
name: Login
url: http://localhost:8080/api/v1/auth/login
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"testuser\",\r

    \  \"password\": \"password123\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.environment.set(\"accessToken\",  json.accessToken);\r

      pm.environment.set(\"refreshToken\", json.refreshToken);\r

      \r

      console.log(\"Токен сохранён:\", json.accessToken);\r

      \r

      pm.test(\"Логин успешен\", () => {\r

      \    pm.response.to.have.status(200);\r

      \    pm.expect(json.accessToken).to.be.a(\"string\");\r

      });"
    language: text/javascript
